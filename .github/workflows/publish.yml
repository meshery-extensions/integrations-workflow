name: Publish Meshery Integrations
# Reusable workflow called by meshery/meshery on schedule and demand.
# Builds mesheryctl from the caller, then publishes integration content into:
#   - meshery.io      (integrations site)
#   - meshery docs    (in-tree docs in meshery/meshery)
#   - all subscribed ecosystem partenrs
#
# Service account: meshery-integrations-sheet@meshery-237716.iam.gserviceaccount.com
# Setup: https://theoephraim.github.io/node-google-spreadsheet/#/guides/authentication

on:
  workflow_call:
    secrets:
      MESHERY_CI:
        description: PAT with push access to the publish targets
        required: true
      INTEGRATION_SPREADSHEET_CRED:
        description: Service-account JSON for the integrations spreadsheet
        required: true
      MAIL_USERNAME:
        description: SMTP username for failure notifications
        required: true
      MAIL_PASSWORD:
        description: SMTP password for failure notifications
        required: true

jobs:
  integrations:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Meshery repo
        uses: actions/checkout@master
        with:
          repository: meshery/meshery
          path: meshery
          token: ${{ secrets.MESHERY_CI }}

      - name: Checkout Layer5 website repo
        uses: actions/checkout@master
        with:
          repository: layer5io/layer5
          token: ${{ secrets.MESHERY_CI }}
          path: l5

      - name: Checkout Meshery.io repo
        uses: actions/checkout@master
        with:
          repository: meshery/meshery.io
          token: ${{ secrets.MESHERY_CI }}
          path: meshery.io

      - name: Checkout Remote Provider repo
        uses: actions/checkout@master
        with:
          repository: layer5io/meshery-cloud
          token: ${{ secrets.MESHERY_CI }}
          path: meshery-cloud

      - name: Checkout TCS Labs Remote Provider repo
        uses: actions/checkout@master
        with:
          repository: tata-consulting/meshery-remote-provider
          token: ${{ secrets.MESHERY_CI }}
          path: meshery-remote-provider

      - name: Build mesheryctl
        working-directory: ./meshery/mesheryctl
        run: make;

      - name: Publish to meshery.io site
        working-directory: ./meshery/mesheryctl
        run: ./mesheryctl registry publish website ${{ secrets.INTEGRATION_SPREADSHEET_CRED }} 1DZHnzxYWOlJ69Oguz4LkRVTFM79kC2tuvdwizOJmeMw ../../meshery.io/integrations ../meshery.io/assets/images/integration -o js

      - name: Clean paths in data.js
        working-directory: ./meshery.io/integrations
        run: |
          sed -i 's|"meshery\.io/|"/|g' data.js

      - name: Build and inject OCI files to custom models in catalog
        working-directory: ./meshery/mesheryctl
        run: |
          set -euo pipefail
          mkdir -p ../../meshery.io/assets/modelsFiles

          declare -A PRESET
          if models_json=$(./mesheryctl model list --json 2>/dev/null); then
            while read -r n; do PRESET["$n"]=1; done < <(echo "$models_json" | jq -r '.[].name' | tr '[:upper:]' '[:lower:]' | sed 's/ /-/g')
          fi

          PAGES_DIR="../../meshery.io/collections/_models"
          shopt -s nullglob
          for page in "$PAGES_DIR"/*/*.md; do
            dir="$(dirname "$page")"
            slug="$(basename "$dir")"

            if [[ -n "${PRESET[$slug]:-}" ]]; then
              echo "Skipping preexisting model: $slug"
              continue
            fi

            if [[ -f "../../meshery.io/assets/modelsFiles/${slug}.tar" ]]; then
              echo "OCI file already exists for custom model: $slug"
              continue
            fi

            model_name=$(grep -E '^name:' "$page" | head -1 | sed 's/^name:[[:space:]]*//' | tr -d '"' || echo "")
            if [[ -z "$model_name" ]]; then
              echo "WARN: Could not extract model name from $page"
              continue
            fi

            echo "Building OCI for custom model: $model_name (slug: $slug)"
            cd ../../meshery.io/assets/modelsFiles
            ../../../meshery/mesheryctl model build "$model_name" || true
            cd ../../../meshery/mesheryctl
          done

      - name: Pull latest changes from Meshery.io repo
        working-directory: ./meshery.io
        run: git pull origin master

      - name: Commit changes to Meshery.io repo
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: meshery-ci
          repository: ./meshery.io
          commit_user_email: ci@meshery.io
          commit_author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          commit_options: "--signoff"
          commit_message: "[Docs] Generated documentation for Integration"
          branch: master

      - name: Publish to ecosystem partner website
        working-directory: ./meshery/mesheryctl
        run: ./mesheryctl registry publish website ${{ secrets.INTEGRATION_SPREADSHEET_CRED }} 1DZHnzxYWOlJ69Oguz4LkRVTFM79kC2tuvdwizOJmeMw ../layer5/src/collections/integrations ../layer5/src/collections/integrations -o mdx

      - name: Pull latest changes from ecosystem partner website repo
        working-directory: ./l5
        run: git pull origin master

      - name: Commit changes to ecosystem partner website repo
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: l5io
          repository: ./l5
          commit_user_email: ci@meshery.io
          commit_author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          commit_options: "--signoff"
          commit_message: "[Docs] Generated documentation for Integration"
          branch: master

      - name: Publish to Meshery docs
        working-directory: ./meshery/mesheryctl
        run: ./mesheryctl registry publish website ${{ secrets.INTEGRATION_SPREADSHEET_CRED }} 1DZHnzxYWOlJ69Oguz4LkRVTFM79kC2tuvdwizOJmeMw  docs/content/en/extensions/models docs/content/en/extensions/models -o md

      - name: Pull latest changes from Meshery repo
        working-directory: ./meshery
        run: git pull origin master

      - name: Commit changes to Meshery repo
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: l5io
          repository: ./meshery
          commit_user_email: ci@meshery.io
          commit_author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          commit_options: "--signoff"
          commit_message: "[Docs] Generated documentation for Integration"
          branch: master

      - name: Publish to Meshery Remote Provider
        working-directory: ./meshery/mesheryctl
        run: ./mesheryctl registry publish remote-provider ${{ secrets.INTEGRATION_SPREADSHEET_CRED }} 1DZHnzxYWOlJ69Oguz4LkRVTFM79kC2tuvdwizOJmeMw ../meshery-cloud/server/meshmodels/models ../meshery-cloud/ui/public/img/meshmodels

      - name: Pull latest changes from Meshery Remote Provider repo
        working-directory: ./meshery-cloud
        run: git pull origin master

      - name: Commit changes to Meshery Remote Provider repo
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: l5io
          repository: ./meshery-cloud
          commit_user_email: ci@meshery.io
          commit_author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          commit_options: "--signoff"
          commit_message: "Models Updated"
          branch: master

      - name: Publish to TCS Labs Remote Provider
        working-directory: ./meshery/mesheryctl
        run: ./mesheryctl registry publish remote-provider ${{ secrets.INTEGRATION_SPREADSHEET_CRED }} 1DZHnzxYWOlJ69Oguz4LkRVTFM79kC2tuvdwizOJmeMw ../meshery-remote-provider/server/meshmodels/models ../meshery-remote-provider/ui/public/img/meshmodels

      - name: Pull latest changes from TCS Labs Meshery Remote Provider repo
        working-directory: ./meshery-remote-provider
        run: git pull origin master

      - name: Commit changes to TCS Labs Remote Provider repo
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: meshery-ci
          repository: ./meshery-remote-provider
          commit_user_email: ci@meshery.io
          commit_author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          commit_options: "--signoff"
          commit_message: "Models Updated"
          branch: master

      - name: Send Email on Model Publish Failure
        if: failure()
        uses: dawidd6/action-send-mail@v7
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: GitHub Actions - Workflow Failure
          from: |
            "Model Updater" <no-reply@meshery.io>
          to: developers@meshery.io
          body: |
            The GitHub Actions workflow in ${{ github.repository }} has failed.
            You can find more details in the GitHub Actions log ${{ github.workflow }}.
